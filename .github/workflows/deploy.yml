name: deploy
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    name: Release
    concurrency:
      # Only one release job at a time. Strictly sequential.
      group: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all history

      - name: Get All Tags
        run: git fetch --tags -f

      - name: Dry-run Release for Initial Commit
        id: skip_release
        run: |
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Restore Development Environment
        run: uv sync

      # Uncomment to change default logging level during release
      # - name: Change default logging level
      #   run: sed -i -e 's/logging.DEBUG/logging.WARN/g' aamas_review_monitor/__main__.py

      - name: Get Node Version
        id: get-node-version
        run: echo version=$(jq -r .engines.node package.json) >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.get-node-version.outputs.version }}

      - name: Release
        shell: bash
        run: |
          npm install
          npx semantic-release
        env:
          # A personal token if set (needed only if main gets branch protection), else the
          # workflow's own, which `contents: write` lets create releases and push the release commit
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # dry run if not on main/master branch, or if initial commit
          RELEASE_DRY_RUN: ${{ steps.skip_release.outputs.skip == 'true' || (github.ref_name != 'master' && github.ref_name != 'main') }}

      # The release step builds dist/ only when it releases; build it anyway (at the current
      # version) so every run keeps an installable wheel among the workflow artifacts.
      - name: Build Wheel
        run: test -n "$(ls dist/*.whl 2>/dev/null)" || uv build

      - name: Upload Wheel
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error