name: Initialise Repo
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  run-script:
    name: run script
    if: ${{ !github.event.repository.is_template && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        shell: bash

      - name: Checkout
        uses: actions/checkout@v7

      - name: Rename project
        run: |
          AUTHOR_NAME=$(gh api "users/$GITHUB_ACTOR" --jq '.name // .login')
          AUTHOR_EMAIL=$(gh api "users/$GITHUB_ACTOR" --jq '.email // empty')
          bash rename-template.sh "$(basename "$GITHUB_REPOSITORY")" "$AUTHOR_NAME" \
            "${AUTHOR_EMAIL:-$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com}"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Reset project version
        run: |
          sed -i -e 's/^version = ".*"/version = "0.1.0"/g' pyproject.toml
          uv lock
        shell: bash

      - name: Reset Changelog
        run: rm CHANGELOG.md
        shell: bash

      - name: Remove template initialization files
        run: |
          rm .github/workflows/init.yml
        shell: bash

      - name: Change default assignee in renovate.json
        run: |
          sed -i -e "s/gciatto/${{ github.actor }}/g" renovate.json
        shell: bash

      - name: Add files and commit changes
        run: |
          git add .
          git commit -m "chore: initialise repository renaming files and removing init workflow [skip ci]"
          git push -u origin $(git branch --show-current)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
