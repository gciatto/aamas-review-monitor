description: |-
  This area welcomes papers whose primary contribution concerns coordination, organizations, institutions, norms, ethics, accountability, governance, and responsible behavior in agent and multiagent systems. Relevant submissions include theoretical, computational, empirical, and design-oriented work on teamwork, social reasoning, normative systems, institutions, trust, reputation, values, policy, regulation, agreement technologies, and responsible socio-technical systems.

  Research in agent and multiagent systems has a long history of balancing agent autonomy, adaptation, and distributed social reasoning with system-level considerations such as organizational and institutional policy enforcement, safety, security, fairness, and accountability. Submissions may address machine-machine cooperation, human-machine cooperation, and multiagent coordination, especially where these raise questions of transparency, trust, responsibility, governance, or alignment with social norms and ethical values.

  Papers should be submitted to COINE when social, institutional, normative, organizational, governance, or ethical dimensions are central to the contribution. Papers focused primarily on human-subject interaction design or evaluation should be submitted to HAI; papers focused primarily on generative-agent architectures should be submitted to GAAI.
