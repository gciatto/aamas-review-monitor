description: |-
  This area welcomes papers whose primary contribution advances generative and agentic AI systems, namely agents or multiagent systems that act, reason, interact, coordinate, or make decisions by using, integrating, or analyzing generative AI models. Relevant submissions may address foundations, architectures, learning methods, orchestration, tool use, evaluation, safety, alignment, verification, governance, deployment, and human-agent or multiagent interaction in generative-agent systems.

  Papers should be submitted to GAAI when the central technical contribution concerns agents whose capabilities, architecture, reasoning, interaction, learning, evaluation, or deployment substantially rely on generative AI models. Papers whose main contribution is a general learning, planning, engineering, governance, or human-interaction method should instead be submitted to the corresponding AAMAS area, unless the generative-agent aspect is central.

  Submissions where the core contribution is not specifically about agents or multiagent systems are out of scope. Advances in language models, prompt engineering, generic tool use, or arbitrary generative tasks are outside the scope of this area unless they make a clear contribution to autonomous agents or multiagent systems.
