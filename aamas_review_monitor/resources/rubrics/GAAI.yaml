- Open-ended, autonomous, and self-improving agents based on generative AI
- Planning, reasoning, and long-horizon agentic workflows
- Agency and learning in generative and agentic AI
- Interaction protocols for agentic AI
- Coordination, cooperation, and negotiation in generative AI agents
- Normative reasoning and institutional constraints for generative AI agents
- Theory of mind, user modeling, and social reasoning in generative AI agents
- Hybrid classic-generative agents, with a focus on how generative AI agents use classical tools, models,
  and protocols
- Failure handling, recovery, and resilience in agentic AI
- Modeling and analysis of generative AI agents
- Instruction following and multi-turn agent behavior in generative AI agents
- Human-agent interaction for delegation, feedback, and task collaboration in generative AI agents
- Agentic decision support and decision boundaries
- Alignment, learning from human feedback, and controllability of generative and agentic AI systems
- Explainability, introspection, and debugging for generative AI agents and systems
- Assurance, verification, and safety in generative and agentic AI systems
