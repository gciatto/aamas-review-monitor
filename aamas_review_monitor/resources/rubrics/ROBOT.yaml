description: |-
  This area welcomes papers whose primary contribution concerns autonomous robots, robotic agents, multi-robot systems, or the interaction of robots with humans, software agents, or physical environments. Relevant submissions include work on coordination, collaboration, swarms, distributed robotics, robot planning, robot learning, knowledge representation and reasoning for robots, long-term autonomy, execution monitoring, failure recovery, modeling and simulation, explainability, trust, ethics, decision-making, and control for autonomous robots.

  Robots are embodied and situated agents that operate in the physical world. Research on autonomous agents and multiagent systems shares many challenges and synergies with intelligent robotics, especially where robotic systems must reason, learn, plan, coordinate, adapt, or act autonomously in realistic settings.

  Submissions involving perception, vision, mapping, localization, manipulation, or control are welcome when these components are integrated into, or make a clear contribution to, autonomous robots or multi-robot systems.
