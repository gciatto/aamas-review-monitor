description: |-
  This area welcomes theoretical and experimental contributions to knowledge representation and reasoning for single-agent and multiagent systems. Relevant submissions include formal and computational approaches to agent theories, logics for agent reasoning, argumentation, ontologies, knowledge graphs, semantic frameworks, strategic reasoning, reasoning about knowledge, beliefs, goals, actions, plans, and change, verification, autoformalization, logic-constrained learning, and neurosymbolic reasoning.

  Knowledge representation is interpreted broadly, encompassing formal approaches such as epistemic, strategic, and description logics, as well as data-driven techniques such as representation learning, when they support reasoning in agent or multiagent systems. Relevant reasoning paradigms include automated reasoning, theorem proving, verification-based approaches, probabilistic inference, neurosymbolic methods, and reasoning methods that support trustworthiness, accountability, transparency, fairness, explainability, or responsible AI.

  Papers should be submitted to RR when the primary contribution is a representation or reasoning framework, method, analysis, or formalism for agents or multiagent systems. Papers whose primary contribution is planning, scheduling, or optimization should be submitted to SOPS, unless the representation or reasoning formalism is central.
exemplars:
- A modal or epistemic logic for reasoning about agents' knowledge and beliefs, with axiomatisation, decidability
  and model-checking complexity.
- Strategy logics such as alternating-time temporal logic for verifying what coalitions of agents can
  enforce.
- 'Abstract argumentation frameworks: semantics, extensions and the computational complexity of acceptance
  problems.'
- Belief revision and update in multi-agent settings, and reasoning about actions and change.
- Neurosymbolic agents that combine learned perception with logical reasoning or logical constraints.
