description: |-
  This area welcomes theoretical and experimental contributions to search, optimization, planning, and scheduling in single-agent and multiagent systems. Relevant submissions include decentralized planning, planning under uncertainty, decision-theoretic planning, temporal reasoning and scheduling, combinatorial optimization, constraint programming, distributed constraint reasoning, resource and task allocation, plan and goal recognition, human-aware planning and scheduling, and non-strategic coalition formation.

  Contributions that integrate learning-based methods, including foundation models, with search, optimization, planning, and scheduling techniques are welcome, provided that the primary contribution remains in the SOPS area. Similarly, approaches to motion and path planning are relevant when they are framed as planning, search, or decision-making problems for autonomous agents or multiagent systems.

  Papers should be submitted to SOPS when the primary contribution is a search, optimization, planning, scheduling, or decision-theoretic method, even if the method is applied to multiagent, robotic, human-aware, or foundation-model-assisted settings.
