description: |-
  This area welcomes papers whose primary contribution concerns agent-based modeling and simulation of artificial societies and complex systems. Relevant submissions include modeling methods, simulation techniques, tools and platforms, calibration, verification, validation, robustness, participatory simulation, large-scale simulation, and the analysis of emergent behavior in social, organizational, economic, ecological, transportation, and socio-technical systems.

  Artificial societies are computer simulations or models created to emulate and study the behavior of complex social systems. Agent-based models provide a way to analyze how individual behaviors, interactions, incentives, policies, and interventions give rise to emergent structures and dynamics at the system level. Relevant application areas include ecology, biology, economics, transportation, management, organizational studies, and the social sciences.

  Papers should be submitted to SIM when simulation is central to the contribution, either as a methodological advance or as a way to explain, predict, explore, or evaluate complex systems.
exemplars:
- An agent-based model of an epidemic, traffic system or market, calibrated against real data and used
  to evaluate policy interventions.
- A large-scale agent-based simulation platform with parallel or GPU execution for millions of agents.
- Validation and calibration methodology for agent-based models, including sensitivity analysis and surrogate
  models.
- Simulating opinion dynamics, segregation or the evolution of cooperation in artificial societies to
  explain emergent social phenomena.
- Generative agents powered by language models used to simulate human populations and social behaviour.
