[project]
name = "aamas-review-monitor"
version = "1.2.0"
description = "Read-only, deterministic OpenReview process monitor for AAMAS 2027 Senior Area Chairs"
readme = "README.md"
authors = [
    { name = "Giovanni Ciatto", email = "giovanni.ciatto@unibo.it" }
]
requires-python = ">=3.10" # Update workflows/check.yml if you change this
dependencies = [
    "openreview-py>=2.9.0",
    "requests>=2.34.2",
    "textual>=8.2.8",
    "urllib3>=2.8.0",
]

[project.scripts]
aamas_review_monitor = "aamas_review_monitor.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aamas_review_monitor"
module-root = ""

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "mypy>=2.1.0",
    "poethepoet>=0.45.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.poe.tasks]
test = "pytest"
coverage = "coverage run -m pytest"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy aamas_review_monitor tests scripts"
compile = "python -m compileall -q aamas_review_monitor tests scripts"
static-checks = [
    "compile",
    "format-check",
    "ruff-check",
    "mypy",
]
static-fixes = [
    "ruff-fix",
    "format",
]
# Local, untracked Git hooks; append hook names to pick some (pre-commit,
# conventional-commits, no-ai-signature, pre-push)
install-hooks = "python scripts/githooks.py install"
uninstall-hooks = "python scripts/githooks.py uninstall"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
